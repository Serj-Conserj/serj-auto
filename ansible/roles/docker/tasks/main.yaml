# roles/docker/tasks/main.yaml

- name: Install required system packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository to apt
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ docker_ubuntu_version_codename }} stable"
    state: present
    filename: docker

- name: Install Docker
  ansible.builtin.apt:
    name: docker-ce
    state: latest
    update_cache: true

- name: Check Docker is active
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true # Ensures it starts on system boot

- name: Find out if Docker Compose is present
  ansible.builtin.stat:
    path: /usr/local/bin/docker-compose
  register: docker_compose_file

- name: Install Docker Compose if absent
  ansible.builtin.get_url:
    # TODO: set to always latest
    url: https://github.com/docker/compose/releases/download/v2.33.1/docker-compose-linux-x86_64
    dest: /usr/local/bin/docker-compose
    mode: '0755'
  when: not docker_compose_file.stat.exists # Skip installation if present

- name: Verify Docker Compose installation
  ansible.builtin.command: docker-compose --version
  register: compose_version
  changed_when: false
